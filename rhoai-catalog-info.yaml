---
# RHOAI Domain - Top Level
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: rhoai
  title: Red Hat OpenShift AI
  description: |
    Red Hat OpenShift AI is a comprehensive AI/ML platform that provides
    tools and services for data scientists and developers to build, deploy,
    and manage AI applications at scale. Includes both downstream RHOAI
    and upstream OpenDataHub components.
  links:
    - url: https://www.redhat.com/en/technologies/cloud-computing/openshift/openshift-ai
      title: RHOAI Product Page
      icon: web
    - url: https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed
      title: RHOAI Documentation
      icon: docs
    - url: https://opendatahub.io/
      title: OpenDataHub Project
      icon: web
  tags:
    - ai
    - ml
    - platform
    - upstream-downstream
spec:
  owner: group:default/rhoai

---
# Codebase System - Contains all source code components
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: codebase
  title: RHOAI Codebase
  description: |
    All source code components for RHOAI and OpenDataHub platforms,
    including both upstream (OpenDataHub) and downstream (RHOAI) codebases.
  tags:
    - codebase
    - source-code
    - development
spec:
  owner: group:default/rhoai
  domain: rhoai

---
# Testing System - Contains all testing components  
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: testing
  title: RHOAI Testing Infrastructure
  description: |
    Testing infrastructure and frameworks for RHOAI and OpenDataHub
    including CI/CD pipelines, test suites, and quality assurance tools.
  tags:
    - testing
    - ci-cd
    - qa
    - quality-assurance
spec:
  owner: group:default/rhoai
  domain: rhoai

---
# Documentation System - Contains all documentation
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: docs
  title: RHOAI Documentation
  description: |
    Documentation ecosystem for RHOAI and OpenDataHub including
    user guides, API documentation, and developer resources.
  tags:
    - documentation
    - guides
    - api-docs
    - knowledge-base
spec:
  owner: group:default/rhoai
  domain: rhoai

---
# Codebase Components - Top Level Groupings
# Downstream Codebase Component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: downstream-codebase
  title: RHOAI Downstream Codebase
  description: |
    Red Hat's supported, enterprise-ready AI/ML platform codebase.
    Contains all downstream RHOAI components including operators,
    dashboards, and enterprise features.
  tags:
    - codebase
    - downstream
    - enterprise
    - grouping
spec:
  type: library
  lifecycle: production
  owner: group:default/rhoai
  system: codebase

---
# Upstream Codebase Component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: upstream-codebase
  title: OpenDataHub Upstream Codebase
  description: |
    Open source AI/ML platform codebase providing data science tools and
    workflows. Contains all upstream OpenDataHub components that RHOAI
    is based on.
  links:
    - url: https://opendatahub.io/
      title: OpenDataHub Website
      icon: web
    - url: https://github.com/opendatahub-io
      title: OpenDataHub GitHub Organization
      icon: github
  tags:
    - codebase
    - upstream
    - open-source
    - grouping
spec:
  type: library
  lifecycle: production
  owner: group:default/rhoai
  system: codebase

---
# RHOAI Components (Depends on Downstream Codebase)
# RHOAI Operator
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: rhoai-operator
  title: RHOAI Operator
  description: |
    Kubernetes operator that manages the lifecycle of RHOAI
    components and handles installation, configuration, and updates
    for the downstream Red Hat OpenShift AI product.
  annotations:
    github.com/project-slug: 'red-hat-data-services/rhods-operator'
    github.com/issues: 'true'
    github.com/pull-requests: 'true'
  tags:
    - operator
    - downstream
    - kubernetes
spec:
  type: service
  lifecycle: production
  owner: group:default/rhoai
  system: codebase
  dependsOn:
    - component:downstream-codebase

---
# RHOAI Dashboard
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: rhoai-dashboard
  title: RHOAI Dashboard
  description: |
    Web-based dashboard providing unified access to RHOAI services
    and tools for data scientists and administrators. Enterprise
    version with Red Hat branding and additional features.
  annotations:
    github.com/project-slug: 'red-hat-data-services/odh-dashboard'
    github.com/issues: 'true'
    github.com/pull-requests: 'true'
  tags:
    - dashboard
    - ui
    - downstream
spec:
  type: website
  lifecycle: production
  owner: group:default/rhoai
  system: codebase
  dependsOn:
    - component:downstream-codebase

---
# OpenDataHub Components (Depends on Upstream Codebase)
# ODH Operator
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: odh-operator
  title: OpenDataHub Operator
  description: |
    Kubernetes operator that manages the lifecycle of OpenDataHub
    components. The upstream operator that the RHOAI operator is based on.
  annotations:
    github.com/project-slug: 'opendatahub-io/opendatahub-operator'
    github.com/issues: 'true'
    github.com/pull-requests: 'true'
  links:
    - url: https://github.com/opendatahub-io
      title: OpenDataHub GitHub
      icon: github
  tags:
    - operator
    - upstream
    - kubernetes
spec:
  type: service
  lifecycle: production
  owner: group:default/rhoai
  system: codebase
  dependsOn:
    - component:upstream-codebase

---
# ODH Dashboard
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: odh-dashboard
  title: OpenDataHub Dashboard
  description: |
    Web-based dashboard providing unified access to OpenDataHub services
    and tools. The upstream dashboard that the RHOAI dashboard is based on.
  annotations:
    github.com/project-slug: 'opendatahub-io/odh-dashboard'
    github.com/issues: 'true'
    github.com/pull-requests: 'true'
  links:
    - url: https://opendatahub.io/
      title: OpenDataHub Website
      icon: web
  tags:
    - dashboard
    - ui
    - upstream
spec:
  type: website
  lifecycle: production
  owner: group:default/rhoai
  system: codebase
  dependsOn:
    - component:upstream-codebase

---
# Testing System Components
# Test Suite Component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: test-suite
  title: RHOAI Test Suite
  description: |
    Comprehensive test suite covering unit tests, integration tests,
    and end-to-end testing for RHOAI and OpenDataHub components.
  annotations:
    github.com/project-slug: 'PLACEHOLDER/rhoai-test-suite'
    github.com/issues: 'true'
    github.com/pull-requests: 'true'
  tags:
    - testing
    - qa
    - automation
spec:
  type: service
  lifecycle: experimental
  owner: group:default/rhoai
  system: testing

---
# Documentation System Components  
# Documentation Site
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: docs-site
  title: RHOAI Documentation Site
  description: |
    Main documentation website containing user guides, tutorials,
    API references, and developer documentation for RHOAI and OpenDataHub.
  annotations:
    github.com/project-slug: 'PLACEHOLDER/rhoai-docs'
    github.com/issues: 'true'
    github.com/pull-requests: 'true'
  tags:
    - documentation
    - website
    - guides
spec:
  type: website
  lifecycle: production
  owner: group:default/rhoai
  system: docs
